# =============================================================================
# MMCS Redis — StatefulSet, PVC & Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mmcs-redis
  namespace: mmcs
  labels:
    app.kubernetes.io/name: mmcs-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mmcs
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: mmcs-redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mmcs-redis-pvc
  namespace: mmcs
  labels:
    app.kubernetes.io/name: mmcs-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mmcs-redis
  namespace: mmcs
  labels:
    app.kubernetes.io/name: mmcs-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mmcs
spec:
  serviceName: mmcs-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mmcs-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mmcs-redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          args:
            - "--save"
            - "300 10"
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: standard
