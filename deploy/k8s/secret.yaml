# =============================================================================
# MMCS Secret — 敏感配置占位模板
# 使用前请替换 base64 编码的值：
#   echo -n "your-value" | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mmcs-secret
  namespace: mmcs
  labels:
    app.kubernetes.io/name: mmcs
    app.kubernetes.io/part-of: mmcs
type: Opaque
data:
  # PostgreSQL 密码
  postgres-password: bW1jcw==  # mmcs

  # JWT Secret
  jwt-secret: ""
  # 生成: echo -n "your-256-bit-secret" | base64

  # Crypto Master Key
  crypto-master-key: ""

  # OpenAI API Key
  openai-api-key: ""

  # Redis 密码 (如果没有 password 则为空)
  redis-password: ""
