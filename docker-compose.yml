version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mmcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmcs
      POSTGRES_PASSWORD: mmcs
      POSTGRES_DB: mmcs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.up.sql:/docker-entrypoint-initdb.d/001_init.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmcs -d mmcs"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=vector"
      - "-c"
      - "max_connections=200"

  redis:
    image: redis:7-alpine
    container_name: mmcs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
